<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030504">
<title>Tanzanija 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;500;700&family=Bungee&family=Monoton&family=Rubik+Mono+One&family=Abril+Fatface&family=Pacifico&family=Permanent+Marker&family=Righteous&family=Press+Start+2P&family=Lobster&family=Black+Ops+One&family=Fredoka:wght@700&family=Playfair+Display:ital,wght@1,900&family=Shrikhand&family=Russo+One&display=swap">
<style>
  /* Layout: full-screen stage. Scene 1 = 5 s intro on a sky→ocean gradient; scene 2 = glowing countdown over a canvas of chasing dots. */
  :root {
    color-scheme: dark;
    --sky: #7fd3ff;
    --ocean: #06205a;
    --night: #030504;
    --glow: #fff1a8;
    --text: #f2f8ff;
    --muted: #f3dc7a;
    --display: "Bebas Neue", "Impact", "Arial Narrow", sans-serif;
    --body: "Outfit", "Helvetica Neue", Arial, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--text);
    font-family: var(--body);
    overflow: hidden;
  }

  /* ---------- INTRO ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    padding-inline: 16px;
    cursor: pointer;
  }
  #intro.flying { pointer-events: none; }
  .introbg {
    position: absolute; inset: 0;
    background: #000;
    transition: opacity 1.4s ease;
  }
  #intro.flying .introbg, #intro.flying video, #intro.flying .skip, #intro.flying .introdark { opacity: 0; transition: opacity 1.4s ease; }
  .introdark { position: absolute; inset: 0; background: #000; opacity: .55; transition: opacity .35s ease; }
  #intro.dark .introdark { opacity: .88; }
  @keyframes tide { from { background-position: 0 0; } to { background-position: 0 100%; } }

  /* optional video layer — drop the file in and it plays behind the text */
  #intro video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 1;
  }

  .welcome {
    grid-area: 1 / 1;
    text-align: center;
    position: relative;
    text-shadow: 0 2px 24px rgba(4,20,52,.75), 0 0 4px rgba(4,20,52,.5);
    animation: welcome 1.7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .welcome b {
    display: block;
    font-family: var(--body); font-weight: 300;
    font-size: clamp(1.8rem, 8vw, 6.5rem);
    letter-spacing: .3em; text-indent: .3em;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .welcome small {
    display: block; margin-top: .4em;
    font-size: clamp(1rem, 3.5vw, 1.6rem);
    letter-spacing: .5em; text-indent: .5em;
    color: var(--glow); opacity: .9;
  }
  .welcome b span { display: inline-block; opacity: 0; transform: translateY(40px) scale(.6); animation: letter .5s cubic-bezier(.2,.9,.3,1.4) forwards; }
  @keyframes letter { to { opacity: 1; transform: none; } }
  @keyframes welcome {
    0%, 75% { opacity: 1; transform: scale(1); filter: blur(0); }
    100% { opacity: 0; transform: scale(1.6); filter: blur(12px); }
  }

  .tz {
    grid-area: 1 / 1;
    position: relative;
    font-size: clamp(2.2rem, 11.5vw, 11rem);
    line-height: 1;
    white-space: nowrap;
    text-shadow: 0 0 30px rgba(255,255,255,.55), 0 6px 0 rgba(4,20,52,.35);
    opacity: 0;
  }
  .tz.on { animation: tzIn .35s ease-out forwards; }
  .tz.settled {
    font-family: var(--body); font-weight: 700; color: #fff;
    font-size: clamp(2rem, 10vw, 8.5rem);
    letter-spacing: .18em; text-indent: .18em;
    text-shadow: 0 0 18px #fff3b0, 0 0 50px #f5b800;
  }
  @keyframes tzIn { from { opacity: 0; transform: scale(2.2); } to { opacity: 1; transform: scale(1); } }

  .skip {
    position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0;
    text-align: center; font-size: .8rem; letter-spacing: .2em; text-transform: uppercase;
    color: var(--text); opacity: .6;
  }

  /* ---------- COUNTDOWN ---------- */
  #field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #main {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(18px, 4vh, 40px);
    padding-inline: 16px;
    text-align: center;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.35) 0%, rgba(0,0,0,.1) 45%, rgba(0,0,0,.45) 100%);
  }
  .title {
    margin: 0;
    font-family: var(--body); font-weight: 700;
    font-size: clamp(1.8rem, 7vw, 3.6rem); line-height: 1;
    letter-spacing: .18em; text-indent: .18em;
    color: #fff;
    text-shadow: 0 0 18px #fff3b0, 0 0 50px #f5b800;
  }
  .eyebrow {
    font-size: clamp(.8rem, 2.4vw, 1.05rem);
    letter-spacing: .45em; text-indent: .45em;
    text-transform: uppercase; color: var(--muted);
  }
  .clock {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(10px, 3vw, 36px);
  }
  .unit {
    display: flex; flex-direction: column; align-items: center;
    min-width: 0;
  }
  .num {
    font-family: var(--display);
    font-size: clamp(3rem, min(16vw, 16vh), 12.5rem);
    line-height: .9;
    font-variant-numeric: tabular-nums;
    color: #fff;
    text-shadow:
      0 0 8px #fff3b0,
      0 0 24px #fcd116,
      0 0 60px #f5b800,
      0 0 110px #e09a00;
    animation: pulse 3s ease-in-out infinite;
  }
  .unit:first-child .num { font-size: clamp(4rem, min(22vw, 21vh), 16rem); }
  .lbl {
    font-size: clamp(.7rem, 2vw, 1rem);
    letter-spacing: .35em; text-indent: .35em;
    text-transform: uppercase; color: var(--muted);
  }
  @keyframes pulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.25); }
  }
  .sep {
    font-family: var(--display);
    font-size: clamp(3rem, 12vw, 9rem); line-height: .9;
    color: var(--glow); opacity: .5; align-self: flex-start;
  }
  .date {
    font-size: clamp(.9rem, 2.6vw, 1.2rem);
    letter-spacing: .2em; color: var(--text);
  }
  .date strong { font-weight: 700; }
  .flag { display: inline-flex; height: .7em; width: 1.1em; margin-inline: .5em; vertical-align: baseline; border-radius: 2px; overflow: hidden;
    background: linear-gradient(135deg, #1eb53a 0 36%, #fcd116 36% 40%, #111 40% 60%, #fcd116 60% 64%, #00a3dd 64%); }

  @media (max-width: 560px) {
    .sep { display: none; }
    .clock { gap: 10px; flex-wrap: nowrap; }
    .num { font-size: 13.5vw; }
    .unit:first-child .num { font-size: 18vw; }
    .lbl { font-size: .62rem; letter-spacing: .18em; text-indent: .18em; }
    .date { letter-spacing: .08em; max-width: 30ch; }
    .eyebrow { letter-spacing: .3em; text-indent: .3em; }
  }

  /* prijelaz: dok traje uvod, odbrojavanje je skriveno; zatim se dijelovi redom podignu iz zamućenja */
  #field { transition: opacity 1.6s ease; }
  #flagbg {
    position: fixed; inset: 0; opacity: .24;
    background: linear-gradient(135deg,
      #0f7a31 0%, #0f7a31 34%,
      #fcd116 39%, #fcd116 41%,
      #050505 46%, #050505 54%,
      #fcd116 59%, #fcd116 61%,
      #0a86c9 66%, #0a86c9 100%);
  }
  #flagbg { transition: opacity 1.6s ease; }
  body.pre #flagbg { opacity: 0; }
  .rise { transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1), filter .9s ease; transition-delay: calc(var(--i, 0) * 140ms); }
  body.pre #field { opacity: 0; }
  body.pre .rise { opacity: 0; transform: translateY(30px) scale(.94); filter: blur(10px); }
  .title.waiting { visibility: hidden; }

  @media (prefers-reduced-motion: reduce) {
    .num { animation: none; }
  }
</style>
</head>
<body>

<div id="intro" title="Klikni za preskok">
  <div class="introbg"></div>
  <video src="media/intro.mp4" autoplay muted playsinline loop preload="auto"></video>
  <div class="introdark"></div>
  <div class="welcome" id="welcome">
    <b aria-label="Welcome"></b>
    <small>karibu</small>
  </div>
  <div class="tz" id="tz">TANZANIJA</div>
  <div class="skip">klikni za preskok</div>
</div>

<div id="flagbg" aria-hidden="true"></div>
<canvas id="field" aria-hidden="true"></canvas>
<script>document.body.classList.add('pre');</script>

<main id="main">
  <h1 class="title waiting" id="title">TANZANIJA</h1>
  <div class="eyebrow rise" style="--i:0">Jo&scaron; samo</div>
  <div class="clock" role="timer" aria-live="off">
    <div class="unit rise" style="--i:1"><span class="num" id="d">000</span><span class="lbl">dana</span></div>
    <span class="sep rise" style="--i:2">:</span>
    <div class="unit rise" style="--i:2"><span class="num" id="h">00</span><span class="lbl">sati</span></div>
    <span class="sep rise" style="--i:2">:</span>
    <div class="unit rise" style="--i:3"><span class="num" id="m">00</span><span class="lbl">minuta</span></div>
    <span class="sep rise" style="--i:2">:</span>
    <div class="unit rise" style="--i:4"><span class="num" id="s">00</span><span class="lbl">sekundi</span></div>
  </div>
</main>

<script>
(() => {
  const TARGET = new Date(2027, 0, 14, 0, 0, 0); // 14. siječnja 2027., lokalno vrijeme
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- INTRO (5 s) ---------- */
  const intro = document.getElementById('intro');
  const wb = document.querySelector('#welcome b');
  [...'WELCOME'].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch;
    s.style.animationDelay = (i * 70) + 'ms';
    wb.appendChild(s);
  });

  const tz = document.getElementById('tz');
  // 10 fontova po ~200 ms
  const FONTS = ['"Bungee"', '"Abril Fatface"', '"Permanent Marker"', '"Monoton"', '"Lobster"',
    '"Shrikhand"', '"Black Ops One"', '"Press Start 2P"', '"Righteous"', '"Rubik Mono One"'];
  const TZCOLORS = ['#ffffff', '#fcd116', '#1eb53a', '#ffffff', '#fff1a8'];
  let fontTimer, fi = 0;
  const timers = [];
  let ended = false;

  function startTz() {
    intro.classList.add('dark');
    tz.classList.add('on');
    const apply = () => {
      tz.style.fontFamily = FONTS[fi] + ', Impact, sans-serif';
      tz.style.color = TZCOLORS[fi % TZCOLORS.length];
    };
    apply();
    fontTimer = setInterval(() => { fi = (fi + 1) % FONTS.length; apply(); }, 200);
  }
  const title = document.getElementById('title');

  // font se smiri na isti font kao ostatak stranice
  function settle() {
    clearInterval(fontTimer);
    tz.classList.remove('on');
    tz.style.cssText = 'opacity:1';
    tz.classList.add('settled');
  }
  // TANZANIJA odleti na svoje mjesto iznad odbrojavanja, pozadina se utopi u noć
  function fly() {
    intro.classList.add('flying');
    const a = tz.getBoundingClientRect(), b = title.getBoundingClientRect();
    const k = b.width / a.width;
    const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
    const dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    const flight = tz.animate(
      [{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${dx}px, ${dy}px) scale(${k})` }],
      { duration: 1400, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' }
    );
    timers.push(setTimeout(() => document.body.classList.remove('pre'), 600));
    // naslov postaje vidljiv tek kad riječ sleti na njegovo mjesto
    flight.onfinish = finish;
  }
  function finish() {
    if (ended) return;
    ended = true;
    timers.forEach(clearTimeout);
    clearInterval(fontTimer);
    document.body.classList.remove('pre');
    title.classList.remove('waiting');
    intro.remove();
  }

  if (reduce) {
    finish();
  } else {
    timers.push(setTimeout(startTz, 1700));
    timers.push(setTimeout(settle, 3800));
    timers.push(setTimeout(fly, 4500));
    intro.addEventListener('click', finish);
  }

  /* ---------- COUNTDOWN ---------- */
  const el = Object.fromEntries(['d', 'h', 'm', 's'].map(k => [k, document.getElementById(k)]));
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    let diff = Math.max(0, TARGET - new Date());
    const days = Math.floor(diff / 864e5); diff -= days * 864e5;
    const hrs = Math.floor(diff / 36e5); diff -= hrs * 36e5;
    const min = Math.floor(diff / 6e4); diff -= min * 6e4;
    const sec = Math.floor(diff / 1e3);
    el.d.textContent = days;
    el.h.textContent = pad(hrs);
    el.m.textContent = pad(min);
    el.s.textContent = pad(sec);
    if (TARGET - new Date() <= 0) document.querySelector('.eyebrow').textContent = 'Safari njema! Stigli smo 🦒';
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- LOVICA: 3 trkača u koloni, plavi ih juri ---------- */
  const cv = document.getElementById('field');
  const ctx = cv.getContext('2d');
  let W, H, DPR;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  // Troje prijatelja trči u koloni, a lav ih juri odostraga.
  // Svi idu po istoj stazi i nikad ne staju; lav je uvijek malo iza zadnjeg i nikad ih ne ulovi.
  const rand = (a, b) => a + Math.random() * (b - a);
  const small = () => W < 600;
  const FH = () => small() ? 40 : 54; // visina lica u pikselima

  function loadImg(src) { const im = new Image(); im.src = src; return im; }
  function makeRunner(shirt, img, flower, shorts) {
    // cvjetići na košulji: nasumični položaji unutar košulje (0..1)
    const dots = Array.from({ length: 7 }, () => ({ x: Math.random(), y: Math.random(), r: rand(.07, .12) }));
    return { x: 0, y: 0, vx: 0, vy: 0, shirt, img, flower, shorts, dots, phase: rand(0, 6.28) };
  }
  // redoslijed: prvi u koloni -> zadnji (najbliži lavu)
  const runners = [
    makeRunner('#1f6fe0', loadImg('faces/face1.webp'), '#ffffff', '#1f6fe0'),
    makeRunner('#fcd116', loadImg('faces/face2.webp'), '#ff5fa2', '#fcd116'),
    makeRunner('#1eb53a', loadImg('faces/face3.webp'), '#ffffff', '#1eb53a'),
  ];
  const lion = makeRunner('#d98a2b', null);
  lion.isLion = true;

  // vođa kolone: stalna brzina, glatko skretanje, izbjegava rubove
  const bandTop = () => H / 3, bandBot = () => H * 2 / 3;
  const lead = { x: W * .3, y: H * .5, ang: rand(0, 6.28), goal: null, goalUntil: 0, clock: 0 };
  const SPEED = 3.2;
  const trail = [{ x: lead.x, y: lead.y, s: 0 }];
  let dist = 0;

  // novi nasumični cilj negdje na ekranu, dovoljno daleko da pretrče pola ekrana
  function newGoal() {
    const m = Math.min(90, Math.min(W, H) * .12);
    const far = W * .35;
    let g;
    for (let i = 0; i < 20; i++) {
      g = { x: rand(m, W - m), y: rand(bandTop() + FH() * 1.2, bandBot() - 10) };
      if (Math.hypot(g.x - lead.x, g.y - lead.y) > far) break;
    }
    lead.goal = g;
    lead.goalUntil = lead.clock + 480; // ako ga ne stignu za ~8 s, biraju drugi
  }

  function advanceLead(dt) {
    lead.clock += dt;
    if (!lead.goal || lead.clock > lead.goalUntil || Math.hypot(lead.goal.x - lead.x, lead.goal.y - lead.y) < 50) newGoal();
    let diff = Math.atan2(lead.goal.y - lead.y, lead.goal.x - lead.x) - lead.ang;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    const maxTurn = .045 * dt;
    lead.ang += Math.max(-maxTurn, Math.min(maxTurn, diff)) + Math.sin(lead.clock * .07) * .01 * dt;
    const step = SPEED * (small() ? .8 : 1) * dt;
    lead.x = Math.max(8, Math.min(W - 8, lead.x + Math.cos(lead.ang) * step));
    lead.y = Math.max(bandTop() + FH() * 1.2, Math.min(bandBot(), lead.y + Math.sin(lead.ang) * step));
    dist += step;
    trail.push({ x: lead.x, y: lead.y, s: dist });
    while (trail.length > 2 && dist - trail[1].s > 900) trail.shift();
  }

  // točka na stazi 'back' piksela iza vođe
  function onTrail(back) {
    const target = dist - back;
    for (let i = trail.length - 1; i > 0; i--) {
      const a = trail[i - 1], b = trail[i];
      if (a.s <= target) {
        const k = (target - a.s) / ((b.s - a.s) || 1);
        return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
      }
    }
    return { x: trail[0].x, y: trail[0].y };
  }

  function place(a, p, dt, now) {
    a.vx = (p.x - a.x) / (dt || 1); a.vy = (p.y - a.y) / (dt || 1);
    a.x = p.x; a.y = p.y;
    const before = Math.sin(a.phase);
    a.phase += Math.hypot(a.vx, a.vy) * .1 * dt;
    if (Math.sign(before) !== Math.sign(Math.sin(a.phase))) {
      dust.push({ x: a.x - a.vx * 2 + rand(-4, 4), y: a.y + rand(-2, 2), t: now, s: rand(2.5, 5) });
    }
  }

  const dust = [];
  // zagrij stazu da kolona krene već poredana
  for (let i = 0; i < 300; i++) advanceLead(1);

  let last = performance.now();
  function step(now) {
    const dt = Math.min(2.5, (now - last) / 16.67); last = now;
    ctx.clearRect(0, 0, W, H);
    drawPlane(now);
    drawBottom(now);
    drawBalloon(now);

    advanceLead(dt);
    const GAP = FH() * 1.3;
    runners.forEach((r, i) => place(r, onTrail(i * GAP), dt, now));
    // lav: uvijek iza zadnjeg, razmak se širi i sužava, ali nikad ne dotakne
    const t = now / 1000;
    const chase = GAP * 2 + FH() * 1.9 + FH() * .8 * (0.5 + 0.5 * Math.sin(t * 1.3)) + FH() * .25 * Math.sin(t * 3.1);
    place(lion, onTrail(chase), dt, now);

    // prašina od koraka
    for (let i = dust.length - 1; i >= 0; i--) {
      const q = dust[i], k = (now - q.t) / 700;
      if (k > 1) { dust.splice(i, 1); continue; }
      ctx.globalAlpha = (1 - k) * .35;
      ctx.fillStyle = '#e9d3a8';
      ctx.beginPath(); ctx.arc(q.x, q.y - k * 6, q.s + k * 7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // tko je niže na ekranu, crta se ispred
    [...runners, lion].sort((a, b) => a.y - b.y).forEach(a => a.isLion ? drawLion(a, now) : drawFriend(a));
    requestAnimationFrame(step);
  }

  function shadow(x, y, w) {
    ctx.globalAlpha = .35; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(x, y, w, w * .28, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function limb(x1, y1, len, ang, w, color) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 + Math.sin(ang) * len, y1 + Math.cos(ang) * len); ctx.stroke();
  }
  function speedLines(a, top, h, color) {
    const sp = Math.hypot(a.vx, a.vy);
    if (sp < 1.5) return;
    const ang = Math.atan2(a.vy, a.vx);
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.globalAlpha = .45;
    for (const k of [.25, .5, .75]) {
      const y = top + h * k;
      ctx.beginPath();
      ctx.moveTo(a.x - Math.cos(ang) * h * .45, y - Math.sin(ang) * h * .2);
      ctx.lineTo(a.x - Math.cos(ang) * h * .85, y - Math.sin(ang) * h * .4);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  const SKIN = '#f1c7a5';

  // safari šešir na glavi: x je sredina glave, top je vrh slike lica, w širina lica
  function hat(x, top, w) {
    const by = top + w * .26;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 4;
    ctx.fillStyle = '#c9a764';
    ctx.beginPath(); ctx.ellipse(x, by, w * .66, w * .1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#dcbd78';
    ctx.beginPath(); ctx.roundRect(x - w * .37, top - w * .08, w * .74, by - top + w * .08, [w * .3, w * .3, w * .04, w * .04]); ctx.fill();
    ctx.fillStyle = '#6b4a2a';
    ctx.fillRect(x - w * .37, by - w * .12, w * .74, w * .07);
    ctx.restore();
  }

  // osoba: pravo lice, havajska košulja, kratke hlače iste boje
  // legs/arms su kutevi od okomice (lijeva, desna), x/y su stopala
  function drawPerson(a, x, y, fh, legA, armA, lean) {
    const img = a.img;
    const fw = img.complete && img.naturalHeight ? fh * img.naturalWidth / img.naturalHeight : fh * .7;
    const legLen = fh * .52, torsoH = fh * .52, torsoW = fh * .56;
    ctx.save();
    ctx.translate(x, y - legLen);
    ctx.rotate(lean);
    // noge: koža ispod, nogavice gore
    [[-.22, legA[0]], [.22, legA[1]]].forEach(([ox, ang]) => {
      limb(torsoW * ox, 0, legLen, ang, fh * .11, SKIN);
      limb(torsoW * ox, 0, legLen * .45, ang, fh * .2, a.shorts);
    });
    ctx.fillStyle = a.shorts;
    ctx.beginPath(); ctx.roundRect(-torsoW * .46, -fh * .06, torsoW * .92, fh * .16, fh * .04); ctx.fill();
    // ruke: kratki rukav, pa koža
    [[-.5, armA[0]], [.5, armA[1]]].forEach(([ox, ang]) => {
      limb(torsoW * ox, -torsoH + fh * .07, fh * .4, ang, fh * .09, SKIN);
      limb(torsoW * ox, -torsoH + fh * .07, fh * .17, ang, fh * .17, a.shirt);
    });
    // košulja s cvjetićima
    ctx.save();
    ctx.beginPath(); ctx.roundRect(-torsoW / 2, -torsoH, torsoW, torsoH + fh * .03, fh * .1);
    ctx.fillStyle = a.shirt; ctx.fill();
    ctx.clip();
    ctx.fillStyle = a.flower;
    for (const d of a.dots) {
      const cx = -torsoW / 2 + d.x * torsoW, cy = -torsoH + d.y * torsoH, r = d.r * fh;
      for (let p = 0; p < 5; p++) {
        const an = p / 5 * Math.PI * 2;
        ctx.beginPath(); ctx.arc(cx + Math.cos(an) * r * .6, cy + Math.sin(an) * r * .6, r * .45, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let b = 1; b <= 3; b++) { ctx.beginPath(); ctx.arc(0, -torsoH + torsoH * b / 4, fh * .025, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    // otvoreni ovratnik
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const k of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(0, -torsoH + fh * .14); ctx.lineTo(k * torsoW * .3, -torsoH - fh * .01); ctx.lineTo(k * torsoW * .08, -torsoH - fh * .01); ctx.closePath(); ctx.fill();
    }
    // glava
    if (img.complete && img.naturalHeight) {
      ctx.save();
      ctx.rotate(Math.sin(a.phase * 2) * .05);
      ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 8;
      ctx.drawImage(img, -fw / 2, -torsoH - fh * .92, fw, fh);
      hat(0, -torsoH - fh * .92, fw);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawFriend(a) {
    const fh = FH();
    const sw = Math.sin(a.phase);
    const bob = Math.abs(sw) * fh * .1;
    const lean = Math.max(-.18, Math.min(.18, a.vx * .05));
    shadow(a.x, a.y, fh * .35);
    speedLines(a, a.y - fh * 1.95 - bob, fh * 1.6, a.shirt);
    drawPerson(a, a.x, a.y - bob, fh, [sw * .8, -sw * .8], [-(sw * 1.1 - .25), sw * 1.1 - .25], lean);
  }

  /* ---------- DNO: lijevo savana sa životinjama, desno more i mi na daskama ---------- */
  const bandH = () => small() ? Math.max(120, H * .22) : Math.max(120, Math.min(200, H * .2));

  function acacia(x, ground, s) {
    ctx.fillStyle = '#3a2a17';
    ctx.beginPath(); ctx.moveTo(x - s * .06, ground); ctx.lineTo(x - s * .02, ground - s * .7); ctx.lineTo(x + s * .02, ground - s * .7); ctx.lineTo(x + s * .07, ground); ctx.fill();
    ctx.strokeStyle = '#3a2a17'; ctx.lineWidth = s * .04; ctx.lineCap = 'round';
    for (const k of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x, ground - s * .55); ctx.lineTo(x + k * s * .35, ground - s * .85); ctx.stroke(); }
    ctx.fillStyle = '#35521f';
    ctx.beginPath(); ctx.ellipse(x, ground - s * .9, s * .6, s * .13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#446a27';
    ctx.beginPath(); ctx.ellipse(x - s * .1, ground - s * .95, s * .4, s * .08, 0, 0, Math.PI * 2); ctx.fill();
  }

  // dolina: savana je visoko na lijevom rubu, more visoko na desnom, a u sredini je najniže
  const ridgeX = () => W / 2;
  function groundAt(x) {
    const bh = bandH(), mid = ridgeX();
    const k = Math.max(0, Math.min(1, x / mid));
    return H - 6 - Math.pow(1 - k, 1.2) * bh * .5;
  }
  const seaBase = () => H - bandH() * .1;
  function seaCurve(x) {
    const mid = ridgeX();
    const k = Math.max(0, Math.min(1, (x - mid) / (W - mid)));
    return -Math.pow(k, 1.2) * bandH() * .42;
  }
  function waveY(x, t, amp, k1, k2, sp) {
    return seaCurve(x) + Math.sin(x * k1 + t * sp) * amp + Math.sin(x * k2 - t * sp * .7) * amp * .45;
  }
  function waveLayer(t, y0, amp, k1, k2, sp, fill, foam) {
    const x0 = ridgeX() - 10;
    ctx.beginPath(); ctx.moveTo(x0, H);
    for (let x = x0; x <= W + 8; x += 8) ctx.lineTo(x, y0 + waveY(x, t, amp, k1, k2, sp));
    ctx.lineTo(W, H); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    if (foam) {
      ctx.strokeStyle = foam; ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let x = x0; x <= W + 8; x += 8) { const yy = y0 + waveY(x, t, amp, k1, k2, sp); x === x0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
      ctx.stroke();
    }
  }

  const BOARDS = ['#ff7a3d', '#ffffff', '#ff4f9a'];
  function drawBottom(now) {
    const t = now / 1000, bh = bandH(), mid = ridgeX();
    const base = seaBase(), amp = bh * .05;

    // more (desna polovica), stražnji val
    waveLayer(t, base - bh * .07, amp * .8, .013, .031, 1.1, 'rgba(56,160,214,.55)', 'rgba(255,255,255,.25)');
    waveLayer(t, base, amp, .018, .041, 1.6, 'rgba(22,112,190,.9)', 'rgba(255,255,255,.7)');

    // kopno: kosina od lijevog ruba dolje do sredine, gdje se spaja s morem
    const shoreEnd = mid + bh * .12;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= mid; x += 6) ctx.lineTo(x, groundAt(x));
    ctx.quadraticCurveTo(mid + bh * .06, groundAt(mid), shoreEnd, H);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, H - bh * .5, 0, H);
    g.addColorStop(0, '#c9953f'); g.addColorStop(1, '#7d5020');
    ctx.fillStyle = g; ctx.fill();
    // pijesak na obali
    ctx.save(); ctx.clip();
    const sand = ctx.createLinearGradient(mid - bh * .9, 0, shoreEnd, 0);
    sand.addColorStop(0, 'rgba(236,210,155,0)'); sand.addColorStop(.5, 'rgba(236,210,155,.95)'); sand.addColorStop(1, '#ecd29b');
    ctx.fillStyle = sand; ctx.fillRect(mid - bh * .9, H - bh, shoreEnd - mid + bh * .9, bh);
    ctx.restore();

    acacia(mid * .2, groundAt(mid * .2) + 2, bh * .7);
    acacia(mid * .62, groundAt(mid * .62) + 2, bh * .55);
    // trava po kosini
    ctx.strokeStyle = 'rgba(240,200,120,.55)'; ctx.lineWidth = 1.5;
    for (let x = 6; x < mid - 8; x += 13) {
      const y = groundAt(x), sway = Math.sin(t * 2 + x * .1) * 2;
      ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x + sway - 3, y - 8 - (x * 7 % 7)); ctx.moveTo(x + 3, y + 2); ctx.lineTo(x + sway + 4, y - 6 - (x * 3 % 6)); ctx.stroke();
    }
    // životinje silaze s brda niz kosinu prema sredini
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, mid, H); ctx.clip();
    drawHerd(now);
    ctx.restore();
    drawJeep(now, mid, bh);
    drawFlagpole(now, mid, bh);

    // mi na daskama
    const span = W - shoreEnd;
    const fh = Math.min(FH() * .9, span * .17);
    runners.forEach((r, i) => {
      const x = shoreEnd + span * (.18 + i * .3) + Math.sin(t * .6 + i * 2) * span * .06;
      const y = base + waveY(x, t, amp, .018, .041, 1.6);
      const slope = (waveY(x + 6, t, amp, .018, .041, 1.6) - waveY(x - 6, t, amp, .018, .041, 1.6)) / 12;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.atan(slope));
      ctx.fillStyle = BOARDS[i];
      ctx.beginPath(); ctx.ellipse(0, -fh * .06, fh * .95, fh * .12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = r.shirt;
      ctx.fillRect(-fh * .8, -fh * .08, fh * 1.6, fh * .04);
      const wob = Math.sin(t * 2.2 + i) * .1;
      drawPerson(r, 0, -fh * .1, fh, [-.45, .45], [-1.25 + wob, 1.25 + wob], wob * .6);
      ctx.restore();
    });
    // prednji val preko dasaka
    waveLayer(t, base + bh * .07, amp * .7, .022, .05, 2.0, 'rgba(12,78,150,.9)', 'rgba(255,255,255,.35)');
  }

  /* ---------- JARBOL sa zastavom Tanzanije koja se vijori ---------- */
  let flagImg = null, flagFor = 0;
  function makeFlag(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * DPR); c.height = Math.ceil(h * DPR);
    const f = c.getContext('2d');
    f.scale(DPR, DPR);
    f.fillStyle = '#1eb53a'; f.beginPath(); f.moveTo(0, 0); f.lineTo(w, 0); f.lineTo(0, h); f.fill();
    f.fillStyle = '#00a3dd'; f.beginPath(); f.moveTo(w, 0); f.lineTo(w, h); f.lineTo(0, h); f.fill();
    // žuto-crna dijagonala
    const band = (width, color) => {
      f.strokeStyle = color; f.lineWidth = width;
      f.beginPath(); f.moveTo(-w * .1, h * 1.1); f.lineTo(w * 1.1, -h * .1); f.stroke();
    };
    band(h * .42, '#fcd116');
    band(h * .3, '#111');
    return c;
  }
  // vulkan u dolini (životinje nestaju iza njega), a na vrhu zastava koja se vijori
  function drawFlagpole(now, mid, bandHeight) {
    const t = now / 1000;
    const bh = Math.min(bandHeight, W * .32); // na uskim ekranima vulkan i zastava su manji
    const base = groundAt(mid) + 6;
    const vh = bh * .85, half = volcanoHalf(), crater = bh * .16;
    const peak = base - vh;

    // dim iz kratera
    for (let i = 0; i < 6; i++) {
      const k = ((t * .25 + i / 6) % 1);
      const px = mid + Math.sin(i * 2.3 + t * .6) * bh * .05 + k * bh * .25;
      const py = peak - k * bh * .55;
      ctx.globalAlpha = (1 - k) * .45;
      ctx.fillStyle = '#9aa0a6';
      ctx.beginPath(); ctx.arc(px, py, bh * (.06 + k * .14), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // sjaj lave iz kratera
    const glow = ctx.createRadialGradient(mid, peak, 2, mid, peak, bh * .35);
    glow.addColorStop(0, `rgba(255,140,30,${.55 + Math.sin(t * 3) * .15})`); glow.addColorStop(1, 'rgba(255,90,0,0)');
    ctx.fillStyle = glow; ctx.fillRect(mid - bh * .4, peak - bh * .4, bh * .8, bh * .6);

    // tijelo vulkana
    ctx.beginPath();
    ctx.moveTo(mid - half, base);
    ctx.quadraticCurveTo(mid - half * .35, base - vh * .35, mid - crater, peak);
    ctx.lineTo(mid + crater, peak);
    ctx.quadraticCurveTo(mid + half * .35, base - vh * .35, mid + half, base);
    ctx.closePath();
    const vg = ctx.createLinearGradient(mid - half, 0, mid + half, 0);
    vg.addColorStop(0, '#3b2f2a'); vg.addColorStop(.45, '#5a4a40'); vg.addColorStop(1, '#2a211d');
    ctx.fillStyle = vg; ctx.fill();
    ctx.save(); ctx.clip();
    // snijeg na vrhu
    ctx.fillStyle = 'rgba(245,248,255,.9)';
    ctx.beginPath();
    ctx.moveTo(mid - crater - bh * .12, peak + vh * .2);
    for (let k = 0; k <= 6; k++) {
      const x = mid - crater - bh * .12 + k * (crater * 2 + bh * .24) / 6;
      ctx.lineTo(x, peak + vh * (k % 2 ? .28 : .18));
    }
    ctx.lineTo(mid + crater + bh * .2, peak - 5); ctx.lineTo(mid - crater - bh * .2, peak - 5); ctx.closePath(); ctx.fill();
    // potoci lave
    ctx.strokeStyle = `rgba(255,${120 + Math.sin(t * 2) * 30 | 0},30,.85)`; ctx.lineWidth = bh * .025; ctx.lineCap = 'round';
    for (const [dx, len, bend] of [[-.4, .55, -.25], [.3, .45, .2], [.05, .7, .08]]) {
      ctx.beginPath(); ctx.moveTo(mid + dx * crater, peak + 2);
      ctx.quadraticCurveTo(mid + dx * crater + bend * bh, peak + vh * len * .5, mid + dx * crater + bend * bh * 1.6, peak + vh * len);
      ctx.stroke();
    }
    ctx.restore();
    // krater
    ctx.fillStyle = '#ff7a1a';
    ctx.beginPath(); ctx.ellipse(mid, peak + 1, crater * .95, bh * .025, 0, 0, Math.PI * 2); ctx.fill();

    // stup na rubu kratera
    const px = mid - crater * .75;
    const poleH = bh * .62;
    const top = peak - poleH;
    const fw = bh * .6, fh = fw * 2 / 3;
    if (!flagImg || flagFor !== fw) { flagImg = makeFlag(fw, fh); flagFor = fw; }
    const pw = Math.max(3, bh * .028);
    const pg = ctx.createLinearGradient(px - pw, 0, px + pw, 0);
    pg.addColorStop(0, '#8d97a3'); pg.addColorStop(.5, '#f1f4f8'); pg.addColorStop(1, '#7c8591');
    ctx.fillStyle = pg;
    ctx.fillRect(px - pw / 2, top, pw, poleH + 2);
    ctx.fillStyle = '#e8c547';
    ctx.beginPath(); ctx.arc(px, top - pw * .4, pw * .9, 0, Math.PI * 2); ctx.fill();

    // zastava u uskim trakama koje se valovito pomiču
    const slices = 36, sw = fw / slices;
    for (let i = 0; i < slices; i++) {
      const k = i / slices;
      const wave = Math.sin(k * 7 - t * 5) * fh * .09 * (k + .15);
      const shade = Math.cos(k * 7 - t * 5) * .18 * k;
      const x = px + pw / 2 + i * sw, y = top + pw * .5 + wave;
      ctx.drawImage(flagImg, i * sw * DPR, 0, sw * DPR + 1, fh * DPR, x, y, sw + .6, fh);
      if (shade) {
        ctx.fillStyle = shade > 0 ? `rgba(255,255,255,${shade})` : `rgba(0,0,0,${-shade})`;
        ctx.fillRect(x, y, sw + .6, fh);
      }
    }
  }

  const volcanoHalf = () => Math.min(bandH() * 1.05, W * .2);

  /* ---------- SAFARI DŽIP: mi troje se vozimo gore-dolje po savani ---------- */
  function drawJeep(now, mid, bh) {
    const t = now / 1000;
    const L = small() ? Math.max(66, W * .2) : Math.min(120, bh * .62);
    const lo = L * .6, hi = mid - volcanoHalf() * .55 - L * .5;
    if (hi <= lo) return;
    // vozi tamo-amo, lagano usporava na krajevima
    const p = .5 - .5 * Math.cos(t * .32);
    const x = lo + (hi - lo) * p;
    const dir = Math.sin(t * .32) >= 0 ? 1 : -1;
    const r = L * .14;
    const y = groundAt(x);
    const ang = Math.atan2(groundAt(x + L * .3) - groundAt(x - L * .3), L * .6);
    const bump = Math.abs(Math.sin(t * 9)) * L * .015;
    const spin = x / r;
    if (Math.random() < .25) dust.push({ x: x - dir * L * .5, y: y - 2, t: now, s: rand(2, 4) });

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    shadow(0, 0, L * .5);
    ctx.scale(dir, 1);

    // kotači
    for (const wx of [-L * .32, L * .32]) {
      ctx.fillStyle = '#1b1b1b';
      ctx.beginPath(); ctx.arc(wx, -r, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#9aa3ad';
      ctx.beginPath(); ctx.arc(wx, -r, r * .5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#555'; ctx.lineWidth = r * .15;
      for (let k = 0; k < 3; k++) {
        const a = spin * dir + k * Math.PI / 3;
        ctx.beginPath(); ctx.moveTo(wx + Math.cos(a) * r * .5, -r + Math.sin(a) * r * .5); ctx.lineTo(wx - Math.cos(a) * r * .5, -r - Math.sin(a) * r * .5); ctx.stroke();
      }
    }
    ctx.translate(0, -bump);
    const bodyTop = -r * 1.1 - L * .24, bodyBot = -r * .7;

    // mi troje u otvorenom stražnjem dijelu
    const seats = [-L * .1, -L * .26, -L * .42];
    runners.forEach((rn, i) => {
      const img = rn.img;
      if (!(img.complete && img.naturalHeight)) return;
      const fh = L * .34, fw = fh * img.naturalWidth / img.naturalHeight;
      ctx.save();
      ctx.translate(seats[i], bodyTop + fh * .15 + Math.sin(t * 7 + i) * L * .01);
      ctx.scale(dir, 1); // lica uvijek gledaju prema nama, ne zrcale se
      ctx.drawImage(img, -fw / 2, -fh, fw, fh);
      hat(0, -fh, fw);
      ctx.restore();
    });

    // karoserija
    ctx.fillStyle = '#c7a14a';
    ctx.beginPath(); ctx.roundRect(-L * .5, bodyTop, L * .78, bodyBot - bodyTop, L * .04); ctx.fill();
    ctx.beginPath(); ctx.roundRect(L * .2, bodyTop + L * .08, L * .32, bodyBot - bodyTop - L * .08, L * .04); ctx.fill(); // hauba
    ctx.fillStyle = '#8a6d2c';
    ctx.fillRect(-L * .5, bodyTop + (bodyBot - bodyTop) * .45, L * 1.02, L * .035);
    // blatobrani
    ctx.fillStyle = '#2d3a22';
    for (const wx of [-L * .32, L * .32]) { ctx.beginPath(); ctx.arc(wx, -r, r * 1.25, Math.PI, 0); ctx.fill(); }
    // svjetlo
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.arc(L * .5, bodyTop + L * .13, L * .025, 0, Math.PI * 2); ctx.fill();
    // rezervna guma straga
    ctx.fillStyle = '#1b1b1b';
    ctx.beginPath(); ctx.ellipse(-L * .53, bodyTop + L * .1, L * .04, r * .8, 0, 0, Math.PI * 2); ctx.fill();
    // okvir krova iznad otvorenog dijela
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = Math.max(2, L * .025); ctx.lineCap = 'round';
    const roof = bodyTop - L * .3;
    ctx.beginPath();
    ctx.moveTo(-L * .48, bodyTop); ctx.lineTo(-L * .48, roof); ctx.lineTo(0, roof);
    ctx.stroke();

    // zatvorena kabina sprijeda: vozač, lokalni safari vodič u šeširu
    const cx0 = 0, cx1 = L * .24;
    ctx.fillStyle = '#b8923d';
    ctx.beginPath();
    ctx.moveTo(cx0, bodyTop + 1); ctx.lineTo(cx0, roof + L * .02);
    ctx.quadraticCurveTo(cx0, roof, cx0 + L * .03, roof);
    ctx.lineTo(cx1 - L * .06, roof); ctx.lineTo(cx1, bodyTop + L * .02); ctx.closePath(); ctx.fill();
    // prozor kabine
    const wx0 = cx0 + L * .03, wx1 = cx1 - L * .045, wy0 = roof + L * .04, wy1 = bodyTop - L * .01;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(wx0, wy1); ctx.lineTo(wx0, wy0); ctx.lineTo(wx1 - L * .03, wy0); ctx.lineTo(wx1, wy1); ctx.closePath();
    ctx.fillStyle = '#9fc9e0'; ctx.fill();
    ctx.clip();
    // vozač (crta se u smjeru vožnje)
    const hx = (wx0 + wx1) / 2 - L * .005, hy = wy1 - L * .07 + Math.sin(t * 7 + 3) * L * .006, hr = L * .065;
    ctx.fillStyle = '#e9e2cf'; // košulja
    ctx.beginPath(); ctx.ellipse(hx, wy1 + L * .02, hr * 1.3, hr * 1.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a3a24'; // lice
    ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(hx + hr * .45, hy - hr * .15, hr * .18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(hx + hr * .5, hy - hr * .15, hr * .09, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#f2e6d8'; ctx.lineWidth = Math.max(1, hr * .14);
    ctx.beginPath(); ctx.arc(hx + hr * .35, hy + hr * .2, hr * .35, .2, 1.3); ctx.stroke(); // osmijeh
    ctx.fillStyle = '#8a6d3b'; // safari šešir
    ctx.beginPath(); ctx.ellipse(hx, hy - hr * .7, hr * 1.35, hr * .25, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(hx - hr * .75, hy - hr * 1.35, hr * 1.5, hr * .7, hr * .3); ctx.fill();
    ctx.fillStyle = '#5b4524'; ctx.fillRect(hx - hr * .75, hy - hr * .85, hr * 1.5, hr * .16);
    // odsjaj stakla
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.beginPath(); ctx.moveTo(wx0, wy0); ctx.lineTo(wx0 + L * .05, wy0); ctx.lineTo(wx0, wy0 + L * .1); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#6f5625'; ctx.lineWidth = Math.max(1.5, L * .015);
    ctx.beginPath(); ctx.moveTo(wx0, wy1); ctx.lineTo(wx0, wy0); ctx.lineTo(wx1 - L * .03, wy0); ctx.lineTo(wx1, wy1); ctx.closePath(); ctx.stroke();
    // antena sa zastavicom
    ctx.strokeStyle = '#444'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-L * .46, roof); ctx.lineTo(-L * .5, roof - L * .2); ctx.stroke();
    if (flagImg) {
      const fw = L * .16, fhh = fw * 2 / 3;
      ctx.drawImage(flagImg, -L * .5 - fw, roof - L * .2, fw, fhh);
    }
    ctx.restore();
  }

  /* ---------- BALON na vrući zrak: mi troje iznad savane ---------- */
  function drawBalloon(now) {
    const t = now / 1000;
    const R = small() ? 28 : 46;
    const mid = W / 2;
    const x = mid * .5 + Math.sin(t * .23) * (mid * .5 - R * 1.3) * .92 + Math.sin(t * .71) * R * .3;
    const y = H - bandH() * 1.05 - R * 2.2 + Math.sin(t * .9) * R * .18 + Math.sin(t * .37 + 1) * R * .3;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(t * .8) * .04);
    // užad
    const bw = R * .9, by = R * 1.55, bhh = R * .5;
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 1.5;
    for (const k of [-1, 1]) { ctx.beginPath(); ctx.moveTo(k * R * .55, R * .8); ctx.lineTo(k * bw * .45, by); ctx.stroke(); }
    // glave u košari
    const fh = R * .62;
    runners.forEach((r, i) => {
      const img = r.img;
      if (!(img.complete && img.naturalHeight)) return;
      const fw = fh * img.naturalWidth / img.naturalHeight;
      const hy = by - fh * .8 + Math.sin(t * 2 + i) * 1.5;
      ctx.drawImage(img, (i - 1) * bw * .3 - fw / 2, hy, fw, fh);
      hat((i - 1) * bw * .3, hy, fw);
    });
    // košara
    ctx.fillStyle = '#9b6a36';
    ctx.beginPath(); ctx.roundRect(-bw / 2, by, bw, bhh, 4); ctx.fill();
    ctx.strokeStyle = '#7a4f24'; ctx.lineWidth = 1.2;
    for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(-bw / 2, by + bhh * k / 4); ctx.lineTo(bw / 2, by + bhh * k / 4); ctx.stroke(); }
    // balon s prugama u bojama zastave
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-R * .45, R * .85);
    ctx.bezierCurveTo(-R * 1.25, R * .1, -R * 1.1, -R * 1.2, 0, -R * 1.2);
    ctx.bezierCurveTo(R * 1.1, -R * 1.2, R * 1.25, R * .1, R * .45, R * .85);
    ctx.closePath();
    ctx.shadowColor = 'rgba(252,209,22,.35)'; ctx.shadowBlur = 20;
    ctx.fillStyle = '#1eb53a'; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.clip();
    const cols = ['#1eb53a', '#fcd116', '#111111', '#fcd116', '#00a3dd', '#fcd116', '#1eb53a'];
    const n = cols.length, sw = R * 2.6 / n;
    cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(-R * 1.3 + i * sw, -R * 1.3, sw + .5, R * 2.3); });
    // sjaj
    const gl = ctx.createRadialGradient(-R * .4, -R * .6, 2, -R * .4, -R * .6, R * 1.2);
    gl.addColorStop(0, 'rgba(255,255,255,.35)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gl; ctx.fillRect(-R * 1.3, -R * 1.3, R * 2.6, R * 2.3);
    ctx.restore();
    ctx.fillStyle = '#6b4a2a';
    ctx.fillRect(-R * .45, R * .8, R * .9, R * .08);
    ctx.restore();
  }

  /* ---------- AVION gore: leti preko ekrana, na prozorima naše glave ---------- */
  function drawPlane(now) {
    const t = now / 1000;
    const s = small() ? .62 : 1;
    const L = 320 * s, h = 50 * s;
    const span = W + L * 2 + 300;
    const x = ((t * 85 * (small() ? .8 : 1)) % span) - L - 150;
    const y = Math.max(h * 1.6, Math.min(H * .11, 120)) + Math.sin(t * 1.1) * 6;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(t * 1.1 + 1) * .025);
    // kondenzacijski trag
    const g = ctx.createLinearGradient(-L * .5, 0, -L * .5 - 320 * s, 0);
    g.addColorStop(0, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 5 * s; ctx.lineCap = 'round';
    for (const oy of [-h * .1, h * .3]) { ctx.beginPath(); ctx.moveTo(-L * .45, oy); ctx.lineTo(-L * .5 - 320 * s, oy); ctx.stroke(); }
    // stražnje krilo (dalje od nas)
    ctx.fillStyle = '#b9c6d6';
    ctx.beginPath(); ctx.moveTo(-L * .02, -h * .2); ctx.lineTo(-L * .16, -h * 1.0); ctx.lineTo(-L * .08, -h * 1.0); ctx.lineTo(L * .1, -h * .2); ctx.fill();
    // repni stabilizator
    ctx.fillStyle = '#1eb53a';
    ctx.beginPath(); ctx.moveTo(-L * .43, -h * .35); ctx.lineTo(-L * .52, -h * 1.35); ctx.lineTo(-L * .4, -h * 1.35); ctx.lineTo(-L * .28, -h * .35); ctx.fill();
    // trup
    ctx.shadowColor = 'rgba(191,233,255,.6)'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#f4f7fb';
    ctx.beginPath();
    ctx.moveTo(-L * .5, -h * .45);
    ctx.lineTo(L * .3, -h * .5);
    ctx.quadraticCurveTo(L * .52, -h * .45, L * .52, h * .1);
    ctx.quadraticCurveTo(L * .5, h * .5, L * .3, h * .5);
    ctx.lineTo(-L * .36, h * .5);
    ctx.quadraticCurveTo(-L * .48, h * .45, -L * .5, -h * .45);
    ctx.fill();
    ctx.shadowBlur = 0;
    // pruge u bojama zastave
    ctx.save(); ctx.clip();
    [['#1eb53a', .22], ['#fcd116', .3], ['#00a3dd', .38]].forEach(([c, oy]) => { ctx.fillStyle = c; ctx.fillRect(-L * .6, h * oy, L * 1.2, h * .08); });
    ctx.restore();
    // pilotska kabina
    ctx.fillStyle = '#16325f';
    ctx.beginPath(); ctx.moveTo(L * .38, -h * .3); ctx.lineTo(L * .47, -h * .28); ctx.quadraticCurveTo(L * .5, -h * .1, L * .47, -h * .05); ctx.lineTo(L * .38, -h * .08); ctx.fill();
    // prozori: tri s našim glavama, ostali prazni
    const r = h * .27;
    const faces = [null, runners[0].img, runners[1].img, runners[2].img, null, null];
    faces.forEach((img, i) => {
      const wx = -L * .3 + i * L * .11, wy = -h * .08;
      ctx.save();
      ctx.beginPath(); ctx.arc(wx, wy, r, 0, Math.PI * 2);
      ctx.fillStyle = img ? '#9fd8ff' : '#2a4d7d'; ctx.fill();
      ctx.clip();
      if (img && img.complete && img.naturalHeight) {
        const ih = r * 2.3, iw = ih * img.naturalWidth / img.naturalHeight;
        const hy = wy - r * .95 + Math.sin(t * 3 + i) * r * .08;
        ctx.drawImage(img, wx - iw / 2, hy, iw, ih);
        hat(wx, hy, iw);
      }
      ctx.restore();
      ctx.strokeStyle = '#8a9bb3'; ctx.lineWidth = 2 * s;
      ctx.beginPath(); ctx.arc(wx, wy, r, 0, Math.PI * 2); ctx.stroke();
    });
    // prednje krilo (bliže nama)
    ctx.fillStyle = '#d5dfeb';
    ctx.beginPath(); ctx.moveTo(-L * .02, h * .25); ctx.lineTo(-L * .2, h * 1.35); ctx.lineTo(-L * .09, h * 1.35); ctx.lineTo(L * .14, h * .25); ctx.fill();
    ctx.fillStyle = '#9aa9bd';
    ctx.beginPath(); ctx.roundRect(-L * .1, h * .62, L * .12, h * .28, h * .12); ctx.fill();
    ctx.restore();
  }

  /* ---------- KRDO dolje: zebre, lavovi, slonovi i žirafe trče preko dna ---------- */
  const HERD_TYPES = ['zebra', 'giraffe', 'zebra', 'elephant', 'lion', 'zebra', 'giraffe', 'elephant', 'zebra', 'lion', 'zebra', 'elephant'];
  const HERD_W = { zebra: 2.6, giraffe: 2.8, elephant: 3.4, lion: 2.6 };
  let herd = [], herdLen = 0, herdFor = 0;
  const unit = () => small() ? 13 : 17;
  function buildHerd() {
    herd = []; herdLen = 0;
    const need = W / 2 + unit() * 10;
    for (let i = 0; herdLen * unit() < need || i < HERD_TYPES.length; i++) {
      const type = HERD_TYPES[i % HERD_TYPES.length];
      herd.push({ type, off: herdLen, ph: rand(0, 6.28), sp: rand(.95, 1.05) });
      herdLen += HERD_W[type] + rand(.3, 1.4);
    }
    herdFor = W;
  }

  function drawHerd(now) {
    if (herdFor !== W) buildHerd();
    const a = unit(), t = now / 1000;
    const total = herdLen * a, v = a * 5;
    for (const m of herd) {
      // trče s lijeva na desno niz brdo i vraćaju se u krug
      const x = ((m.off * a + t * v) % total) - a * 4;
      const fade = Math.max(0, Math.min(1, (ridgeX() - x) / (a * 6)));
      if (fade <= 0) continue;
      const ph = t * 11 * m.sp + m.ph;
      const ground = groundAt(x);
      if (Math.random() < .08) dust.push({ x: x + a * 1.3, y: ground, t: now, s: rand(1.5, 3.5) });
      ctx.save();
      ctx.translate(x, ground);
      ctx.rotate(Math.atan2(groundAt(x + 5) - groundAt(x - 5), 10));
      ctx.globalAlpha = fade;
      shadow(0, 0, a * 1.1);
      ctx.globalAlpha = fade;
      ctx.translate(0, -Math.abs(Math.sin(ph)) * a * .12);
      ANIMALS[m.type](a, ph);
      ctx.restore();
    }
  }

  function legs(a, xs, top, len, w, color, ph, hoof) {
    xs.forEach((ox, i) => {
      const ang = Math.sin(ph + (i % 2 ? Math.PI : 0) + (i > 1 ? .6 : 0)) * .55;
      limb(ox * a, top, len, ang, w, color);
      if (hoof) {
        ctx.fillStyle = hoof;
        ctx.beginPath(); ctx.arc(ox * a + Math.sin(ang) * len, top + Math.cos(ang) * len, w * .55, 0, Math.PI * 2); ctx.fill();
      }
    });
  }
  function tail(a, x, y, color, tuft, ph) {
    ctx.strokeStyle = color; ctx.lineWidth = a * .08; ctx.lineCap = 'round';
    const wig = Math.sin(ph * 1.3) * a * .25;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x - a * .4, y + a * .1, x - a * .45 + wig * .3, y + a * .6); ctx.stroke();
    ctx.fillStyle = tuft;
    ctx.beginPath(); ctx.arc(x - a * .45 + wig * .3, y + a * .65, a * .1, 0, Math.PI * 2); ctx.fill();
  }
  function eye(x, y, r) { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

  const ANIMALS = {
    zebra(a, ph) {
      legs(a, [-.65, -.4, .45, .7], -a * 1.0, a * 1.0, a * .16, '#f4f4f4', ph, '#222');
      tail(a, -a * .9, -a * 1.35, '#f4f4f4', '#111', ph);
      // vrat i glava
      ctx.fillStyle = '#f4f4f4';
      ctx.beginPath(); ctx.moveTo(a * .5, -a * 1.55); ctx.lineTo(a * 1.05, -a * 2.35); ctx.lineTo(a * 1.3, -a * 2.2); ctx.lineTo(a * .95, -a * 1.2); ctx.fill();
      ctx.save(); ctx.translate(a * 1.3, -a * 2.15); ctx.rotate(.55);
      ctx.beginPath(); ctx.ellipse(a * .15, 0, a * .42, a * .17, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.ellipse(a * .5, 0, a * .12, a * .14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = '#111'; ctx.lineWidth = a * .12;
      ctx.beginPath(); ctx.moveTo(a * .55, -a * 1.65); ctx.lineTo(a * 1.1, -a * 2.45); ctx.stroke();
      eye(a * 1.3, -a * 2.25, a * .05);
      // tijelo s prugama
      ctx.save();
      ctx.beginPath(); ctx.ellipse(0, -a * 1.3, a * .95, a * .45, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#f4f4f4'; ctx.fill(); ctx.clip();
      ctx.strokeStyle = '#161616'; ctx.lineWidth = a * .1;
      for (let sx = -.85; sx <= .9; sx += .24) {
        ctx.beginPath(); ctx.moveTo(sx * a, -a * 1.8); ctx.quadraticCurveTo((sx + .1) * a, -a * 1.3, sx * a, -a * .8); ctx.stroke();
      }
      ctx.restore();
    },
    giraffe(a, ph) {
      legs(a, [-.55, -.3, .4, .65], -a * 1.35, a * 1.35, a * .14, '#e9b949', ph, '#5b3a1a');
      tail(a, -a * .8, -a * 1.75, '#e9b949', '#5b3a1a', ph);
      // dugi vrat
      ctx.strokeStyle = '#e9b949'; ctx.lineWidth = a * .28; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a * .5, -a * 1.8); ctx.lineTo(a * 1.05, -a * 3.4); ctx.stroke();
      ctx.fillStyle = '#b5702a';
      for (const k of [.25, .5, .75]) { ctx.beginPath(); ctx.arc(a * (.5 + .55 * k), -a * (1.8 + 1.6 * k), a * .07, 0, Math.PI * 2); ctx.fill(); }
      // glava
      ctx.fillStyle = '#e9b949';
      ctx.save(); ctx.translate(a * 1.15, -a * 3.45); ctx.rotate(.35);
      ctx.beginPath(); ctx.ellipse(a * .15, 0, a * .35, a * .16, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.strokeStyle = '#8a5a26'; ctx.lineWidth = a * .06;
      for (const ox of [-.05, .08]) { ctx.beginPath(); ctx.moveTo(a * (1.05 + ox), -a * 3.5); ctx.lineTo(a * (1.0 + ox), -a * 3.8); ctx.stroke(); }
      eye(a * 1.2, -a * 3.52, a * .05);
      // tijelo s mrljama
      ctx.save();
      ctx.beginPath(); ctx.ellipse(0, -a * 1.7, a * .85, a * .42, -.12, 0, Math.PI * 2);
      ctx.fillStyle = '#e9b949'; ctx.fill(); ctx.clip();
      ctx.fillStyle = '#b5702a';
      for (const [sx, sy] of [[-.6, -1.8], [-.25, -1.55], [.1, -1.9], [.45, -1.6], [-.1, -2.05], [.6, -2.0], [-.5, -1.45], [.25, -1.4]]) {
        ctx.beginPath(); ctx.arc(sx * a, sy * a, a * .12, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    },
    elephant(a, ph) {
      legs(a, [-.75, -.4, .4, .75], -a * .85, a * .85, a * .36, '#8e9aa6', ph * .8, null);
      tail(a, -a * 1.2, -a * 1.4, '#8e9aa6', '#5c6670', ph);
      ctx.fillStyle = '#8e9aa6';
      ctx.beginPath(); ctx.ellipse(0, -a * 1.4, a * 1.25, a * .8, 0, 0, Math.PI * 2); ctx.fill();
      // glava i surla
      ctx.beginPath(); ctx.arc(a * 1.15, -a * 1.7, a * .55, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#8e9aa6'; ctx.lineWidth = a * .22; ctx.lineCap = 'round';
      const sw = Math.sin(ph * .8) * a * .2;
      ctx.beginPath(); ctx.moveTo(a * 1.55, -a * 1.55); ctx.quadraticCurveTo(a * 1.85, -a * .9, a * 1.7 + sw, -a * .45); ctx.stroke();
      ctx.fillStyle = '#f4efe2';
      ctx.beginPath(); ctx.moveTo(a * 1.4, -a * 1.35); ctx.lineTo(a * 1.75, -a * 1.1); ctx.lineTo(a * 1.45, -a * 1.25); ctx.fill();
      // uho
      ctx.fillStyle = '#76828e';
      ctx.beginPath(); ctx.ellipse(a * .85, -a * 1.65, a * .38, a * .5, .2 + Math.sin(ph) * .1, 0, Math.PI * 2); ctx.fill();
      eye(a * 1.35, -a * 1.85, a * .06);
    },
    lion(a, ph) {
      legs(a, [-.6, -.35, .4, .65], -a * .85, a * .85, a * .2, '#d9973f', ph, null);
      tail(a, -a * .9, -a * 1.15, '#d9973f', '#7a3e12', ph);
      ctx.fillStyle = '#e3a64e';
      ctx.beginPath(); ctx.ellipse(0, -a * 1.1, a * .95, a * .42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b8621b';
      ctx.beginPath(); ctx.arc(a * 1.0, -a * 1.5, a * .5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f5c56f';
      ctx.beginPath(); ctx.arc(a * 1.12, -a * 1.47, a * .32, 0, Math.PI * 2); ctx.fill();
      eye(a * 1.2, -a * 1.58, a * .05);
      ctx.fillStyle = '#5a2c0c';
      ctx.beginPath(); ctx.arc(a * 1.4, -a * 1.45, a * .06, 0, Math.PI * 2); ctx.fill();
    },
  };

  // lav: crtana glava s grivom, tijelo, noge i rep; povremeno zareži
  function drawLion(a, now) {
    const s = FH() * .62;
    const sw = Math.sin(a.phase);
    const bob = Math.abs(sw) * s * .12;
    const dir = a.vx >= 0 ? 1 : -1;
    const legLen = s * .75;
    const bodyY = a.y - legLen - bob;
    const roar = Math.max(0, Math.sin(now / 1000 * 1.7)) ** 3;

    shadow(a.x, a.y, s * 1.1);
    ctx.save();
    ctx.translate(a.x, bodyY);
    // rep
    ctx.strokeStyle = '#c47a22'; ctx.lineWidth = s * .12; ctx.lineCap = 'round';
    const tw = Math.sin(now / 160) * .5;
    ctx.beginPath(); ctx.moveTo(-dir * s * .8, -s * .1);
    ctx.quadraticCurveTo(-dir * s * 1.4, -s * (.2 + tw * .3), -dir * s * 1.5, -s * (.7 + tw * .3)); ctx.stroke();
    ctx.fillStyle = '#7a3e12';
    ctx.beginPath(); ctx.arc(-dir * s * 1.5, -s * (.75 + tw * .3), s * .14, 0, Math.PI * 2); ctx.fill();
    // noge
    for (const [ox, ph] of [[-.55, 1], [-.25, -1], [.25, -1], [.55, 1]]) {
      limb(ox * s, 0, legLen, sw * .7 * ph, s * .22, '#d9973f');
    }
    // tijelo
    ctx.fillStyle = '#e3a64e';
    ctx.beginPath(); ctx.ellipse(0, -s * .1, s * .95, s * .5, 0, 0, Math.PI * 2); ctx.fill();
    // glava ide naprijed u smjeru trčanja
    ctx.translate(dir * s * .7, -s * .75);
    // griva
    ctx.fillStyle = '#b8621b';
    for (let i = 0; i < 14; i++) {
      const an = i / 14 * Math.PI * 2 + Math.sin(now / 300) * .05;
      ctx.beginPath(); ctx.arc(Math.cos(an) * s * .72, Math.sin(an) * s * .72, s * .36, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#d27a25';
    ctx.beginPath(); ctx.arc(0, 0, s * .82, 0, Math.PI * 2); ctx.fill();
    // uši
    ctx.fillStyle = '#f0b860';
    for (const ex of [-1, 1]) { ctx.beginPath(); ctx.arc(ex * s * .45, -s * .5, s * .17, 0, Math.PI * 2); ctx.fill(); }
    // lice
    ctx.fillStyle = '#f5c56f';
    ctx.beginPath(); ctx.arc(0, s * .05, s * .58, 0, Math.PI * 2); ctx.fill();
    // oči i ljutite obrve
    ctx.fillStyle = '#1b1b1b';
    for (const ex of [-1, 1]) {
      ctx.beginPath(); ctx.arc(ex * s * .22, -s * .1, s * .07, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#6b3510'; ctx.lineWidth = s * .06;
      ctx.beginPath(); ctx.moveTo(ex * s * .34, -s * .28); ctx.lineTo(ex * s * .1, -s * .2); ctx.stroke();
    }
    // njuška
    ctx.fillStyle = '#fbe2b0';
    for (const ex of [-1, 1]) { ctx.beginPath(); ctx.arc(ex * s * .12, s * .2, s * .16, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#5a2c0c';
    ctx.beginPath(); ctx.moveTo(-s * .1, s * .05); ctx.lineTo(s * .1, s * .05); ctx.lineTo(0, s * .17); ctx.closePath(); ctx.fill();
    // usta: otvaraju se kad zareži
    const mh = s * (.04 + roar * .22);
    ctx.fillStyle = '#7a1414';
    ctx.beginPath(); ctx.ellipse(0, s * .36 + mh / 2, s * (.12 + roar * .08), mh, 0, 0, Math.PI * 2); ctx.fill();
    if (roar > .3) {
      ctx.fillStyle = '#fff';
      for (const ex of [-1, 1]) { ctx.beginPath(); ctx.moveTo(ex * s * .1, s * .34); ctx.lineTo(ex * s * .05, s * .34); ctx.lineTo(ex * s * .075, s * .44); ctx.fill(); }
    }
    ctx.restore();
  }

  ctx.fillStyle = '#041434'; ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
